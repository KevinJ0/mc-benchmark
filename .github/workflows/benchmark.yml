name: Minecraft FPS Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('benchmark-mod/**/*.gradle*', 'benchmark-mod/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Cache Minecraft assets
        uses: actions/cache@v4
        with:
          path: ~/.cache/minecraft
          key: ${{ runner.os }}-minecraft
          restore-keys: ${{ runner.os }}-minecraft

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            mesa-utils \
            libgl1-mesa-dri \
            libgl1 \
            libegl1 \
            libgles2 \
            wget unzip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle wrapper
        run: bash scripts/setup-gradle.sh

      - name: Download mods
        run: bash scripts/download-mods.sh

      - name: Run benchmark
        run: |
          cd benchmark-mod
          xvfb-run -a -s "-screen 0 1024x768x24" \
            ./gradlew runClient --no-daemon -q 2>&1 | tee /tmp/mc-output.log

      - name: Collect results
        run: |
          if [ -f benchmark-mod/run/fps_log.csv ]; then
            cp benchmark-mod/run/fps_log.csv fps_log.csv
            echo "fps_log.csv collected"
          else
            echo "WARNING: fps_log.csv not found"
            ls -la benchmark-mod/run/ 2>/dev/null
          fi

      - name: Generate report
        run: |
          pip install -q -r analyze/requirements.txt
          python3 analyze/report.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            fps_log.csv
            benchmark_report.png
            benchmark_stats.json
