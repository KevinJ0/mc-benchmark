name: Minecraft FPS Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle 8.5
        uses: actions/cache@v4
        with:
          path: /opt/gradle-8.5
          key: ${{ runner.os }}-gradle85

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-cache-${{ hashFiles('benchmark-mod/**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-cache

      - name: Cache Minecraft assets
        uses: actions/cache@v4
        with:
          path: ~/.cache/minecraft
          key: ${{ runner.os }}-minecraft
          restore-keys: ${{ runner.os }}-minecraft

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb mesa-utils libgl1-mesa-dri libgl1 libegl1 libgles2 \
            wget unzip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.5
        run: |
          if [ ! -d /opt/gradle-8.5 ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle85.zip
            sudo unzip -q /tmp/gradle85.zip -d /opt
          fi
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build benchmark mod
        run: |
          cd benchmark-mod
          gradle build --no-daemon -q

      - name: Download mods
        run: bash scripts/download-mods.sh

      - name: Run benchmark
        run: |
          cd benchmark-mod
          mkdir -p run
          xvfb-run -a -s "-screen 0 1024x768x24" \
            gradle runClient --no-daemon -q 2>&1 | tee /tmp/mc-output.log

      - name: Collect results
        run: |
          if [ -f benchmark-mod/run/fps_log.csv ]; then
            cp benchmark-mod/run/fps_log.csv fps_log.csv
            echo "fps_log.csv collected"
          else
            echo "WARNING: fps_log.csv not found"
            ls -la benchmark-mod/run/ 2>/dev/null || true
          fi

      - name: Generate report
        run: |
          pip install -q -r analyze/requirements.txt
          python3 analyze/report.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            fps_log.csv
            benchmark_report.png
            benchmark_stats.json
